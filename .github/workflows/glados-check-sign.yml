name: glados签到
on:
  schedule:
  # 0时区
  - cron: '35 17 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 签到
        run: |
          echo "Beijing Time: $(date -d '+8 hours')"
          checkin='https://glados.one/api/user/checkin'
          points='https://glados.one/api/user/points'
          # 调用签到接口
          resData=`curl -sS $checkin -b '${{ secrets.GLADOS_COOKIE_36863 }}'   -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36' -H 'Content-Type: application/json' -A 'Mozilla/5.0' -d '{"token":"glados.one"}'`
           echo $resData
          echo $resData |jq -r '.message+". balance is "+(.list[0].balance| tonumber|round | tostring) +" points!"'
          sleep 1
          resData=`curl -sS $checkin -b '${{ secrets.GLADOS_COOKIE_XL7 }}'   -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36' -H 'Content-Type: application/json' -A 'Mozilla/5.0' -d '{"token":"glados.one"}'`
          echo $resData |jq -r '.message+". balance is "+(.list[0].balance| tonumber|round | tostring) +" points!"'
          # 间隔1S
          sleep 1
          resData=`curl -sS $checkin -b '${{ secrets.GLADOS_COOKIE_775151 }}'   -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36' -H 'Content-Type: application/json' -A 'Mozilla/5.0' -d '{"token":"glados.one"}'`
          echo $resData |jq -r '.message+". balance is "+(.list[0].balance| tonumber|round | tostring) +" points!"'
          # 间隔1S
          sleep 1
          resData=`curl -sS $checkin -b '${{ secrets.GLADOS_COOKIE_ZXL7_FOX }}'   -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/153.0.0.0 Safari/537.36' -H 'Content-Type: application/json' -A 'Mozilla/5.0' -d '{"token":"glados.one"}'`
          echo $resData |jq -r '.message+". balance is "+(.list[0].balance| tonumber|round | tostring) +" points!"'
          
