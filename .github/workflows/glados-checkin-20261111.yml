name: GLaDOS Auto Checkin

on:
  schedule:
    # 每天北京时间上午 08:30 自动执行 (UTC 时间 00:30)
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持手动点击测试

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行多账号自动签到
        env:
          # 将所有 secrets 打包注入，脚本会自动识别 GLADOS_COOKIE 开头的字段
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: python checkin.py
