name: GLaDOS Auto Checkin

on:
  schedule:
    # 每天北京时间上午 08:30 自动执行 (UTC 时间 00:30)
    - cron: '30 0 * * *'
  workflow_dispatch: # 支持手动点击测试

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests

      - name: 执行多账号自动签到
        env:
          GLADOS_COOKIE_1: ${{ secrets.GLADOS_COOKIE_36863 }}
          GLADOS_COOKIE_2: ${{ secrets.GLADOS_COOKIE_XL7 }}
          GLADOS_COOKIE_3: ${{ secrets.GLADOS_COOKIE_775151 }}
          GLADOS_COOKIE_4: ${{ secrets.GLADOS_COOKIE_ZXL7_FOX }}
        run: python checkin.py
